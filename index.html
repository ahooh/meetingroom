<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>솔바람 모험기</title><style>
*{box-sizing:border-box}body{margin:0;background:#142033;color:#fff1c9;font:15px system-ui;display:grid;place-items:center;min-height:100vh}#box{position:relative;width:min(1000px,100vw)}canvas{width:100%;display:block;border:2px solid #c8b77f;border-radius:10px}.hud{position:absolute;top:12px;left:12px;display:flex;gap:8px;pointer-events:none}.card{background:#17243ddd;border:1px solid #c8b77f;border-radius:8px;padding:8px}.bars{width:220px}.bar{height:10px;background:#303748;margin:4px 0}.fill{height:100%}.hp{background:#ef6472}.mp{background:#5b9fff}.xp{background:#f1ca57}.quest{position:absolute;right:12px;top:82px;width:175px;font-size:13px}.help{position:absolute;bottom:10px;left:10px;background:#111a2ddd;padding:7px;border-radius:8px;font-size:12px}.screen{position:absolute;inset:0;background:#07101dcc;display:none;place-items:center}.screen.on{display:grid}.panel{background:#1b2c46;border:2px solid #d9c88e;border-radius:12px;padding:18px;width:min(440px,92%);max-height:85%;overflow:auto}.row{display:flex;flex-wrap:wrap}.slot{background:#2b3d57;padding:8px;margin:4px;min-width:110px;text-align:center;font-size:13px}button{background:#59728e;color:white;border:1px solid #bac8d8;border-radius:6px;padding:6px 9px;margin:3px;cursor:pointer}.toast{position:absolute;top:80px;left:50%;transform:translateX(-50%);background:#17243ddd;padding:8px;border:1px solid #ead68e;opacity:0}.toast.on{opacity:1}
+</style><div id="box"><canvas width="960" height="540"></canvas><div class="hud"><div class="card bars"><b id="lv"></b><div class="bar"><div id="hp" class="fill hp"></div></div><small id="ht"></small><div class="bar"><div id="mp" class="fill mp"></div></div><small id="mt"></small><div class="bar"><div id="xp" class="fill xp"></div></div><small id="xt"></small></div><div class="card"><span id="gold"></span><br><span id="bagc"></span></div><div class="card" id="mapn"></div></div><div class="card quest" id="quest"></div><div class="help">← → 이동　Alt 점프　Ctrl 공격　Shift 별빛 베기<br>↑ 대화·포탈·사다리　I 가방　Esc 닫기</div><div class="toast" id="toast"></div><div id="screen" class="screen"><div id="panel" class="panel"></div></div></div><script>

// 맵: 발판[x,y,폭], 사다리[x,y,높이], 포탈/NPC/스폰 배치
const maps={town:{name:'솔바람 마을',w:1700,sky:'#91d8eb',pl:[[0,468,1700],[300,370,240],[820,330,250],[1250,390,220]],la:[[420,370,98],[920,330,138]],po:[1550,415,'forest'],npc:[[250,'모아','q'],[530,'단비','s']],sp:[]},forest:{name:'달빛 이끼숲',w:2000,sky:'#304961',pl:[[0,468,2000],[220,380,250],[590,320,260],[1000,390,290],[1440,330,260],[1740,410,210]],la:[[340,380,88],[720,320,148],[1120,390,78],[1545,330,138]],po:[30,415,'town'],npc:[],sp:[['m',320],['m',800],['m',1180],['m',1540],['m',1850],['w',540],['w',1360],['b',950],['b',1740]]}};

const mons={m:{n:'이끼콩',hp:34,w:30,h:27,s:34,ai:0,xp:18,g:7,drop:'herb',c:'#8bd27d'},w:{n:'별반딧불',hp:48,w:24,h:34,s:58,ai:1,xp:27,g:12,drop:'dust',c:'#6de5de'},b:{n:'통통버섯',hp:72,w:38,h:34,s:42,ai:2,xp:40,g:18,drop:'cap',c:'#ec9a75'}};

const $=x=>document.getElementById(x),c=document.querySelector('canvas'),g=c.getContext('2d');let map=maps.town,mapid='town',cam=0,keys={},ms=[],nums=[],fx=[],panel='',last=0,timer;let p={x:110,y:425,w:27,h:43,vx:0,vy:0,face:1,ground:false,climb:false,hp:100,mhp:100,mp:60,mmp:60,lv:1,xp:0,gold:80,bag:[],cd:0,atk:0,inv:0,t:0},quest={on:false,k:0,done:false};
function beep(f,d,type){try{let a=beep.a||(beep.a=new(window.AudioContext||window.webkitAudioContext)()),o=a.createOscillator(),v=a.createGain();o.type=type||'sine';o.frequency.value=f;v.gain.value=.03;v.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(v);v.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function say(s){$('toast').textContent=s;$('toast').classList.add('on');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('on'),2000)}
function hud(){[['hp',p.hp/p.mhp],['mp',p.mp/p.mmp],['xp',p.xp/(p.lv*85)]].forEach(a=>$(a[0]).style.width=Math.max(0,Math.min(1,a[1]))*100+'%');$('ht').textContent='HP '+p.hp+'/'+p.mhp;$('mt').textContent='MP '+p.mp+'/'+p.mmp;$('xt').textContent='EXP '+p.xp+'/'+p.lv*85;$('lv').textContent='Lv.'+p.lv+' · 별숲 탐험가';$('gold').textContent='◈ '+p.gold+'G';$('bagc').textContent='가방 '+p.bag.length+'/12';$('mapn').textContent=map.name;$('quest').innerHTML=quest.done?'의뢰 완료! 모아에게 보상 받기':quest.on?'숲 정화 · 몬스터 '+Math.min(5,quest.k)+'/5':'모아에게 ↑ 대화해 의뢰 받기'}
function gain(n){p.xp+=n;while(p.xp>=p.lv*85){p.xp-=p.lv*85;p.lv++;p.mhp+=18;p.mmp+=10;p.hp=p.mhp;p.mp=p.mmp;beep(880,.3,'triangle');say('레벨 업! Lv.'+p.lv)}hud()}function add(id){if(p.bag.length<12)p.bag.push(id);hud()}
function spawn(){ms=map.sp.map(a=>({t:a[0],x:a[1],home:a[1],y:468-mons[a[0]].h,hp:mons[a[0]].hp,max:mons[a[0]].hp,dir:Math.random()<.5?-1:1,vy:0,alive:true,resp:0,hit:0}))}function travel(id){mapid=id;map=maps[id];p.x=id==='forest'?110:1500;p.y=425;p.vy=0;spawn();say(map.name);hud()}
const screen=$('screen'),box=$('panel');function show(s){panel=s;box.innerHTML=s;screen.classList.add('on')}function close(){panel='';screen.classList.remove('on')}
function questUI(){let t=quest.done?'수고했어요! 120G와 새벽 물약이에요.':quest.on?'숲에서 몬스터를 잡아주세요 ('+Math.min(5,quest.k)+'/5)':'이끼숲 몬스터 다섯 마리를 잡아 주세요. 보상 120G와 새벽 물약!';show('<h2>모아의 부탁</h2><p>'+t+'</p><button id="act">'+(quest.done?'보상 받기':quest.on?'확인':'수락')+'</button><button id="x">닫기</button>');$('act').onclick=()=>{if(quest.done){p.gold+=120;add('potion');quest.done=quest.on=false;say('120G와 새벽 물약을 받았어요')}else if(!quest.on)quest.on=true;close();hud()};$('x').onclick=close}
function shop(){show('<h2>단비의 상점</h2><div class="row">'+Object.keys(items).map(id=>'<div class="slot">'+items[id][0]+'<br>'+items[id][1]+' +'+items[id][2]+' · '+items[id][3]+'G<br><button data-buy="'+id+'">구매</button></div>').join('')+'</div><button id="x">닫기</button>');$('x').onclick=close;document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let a=items[b.dataset.buy];if(p.gold<a[3])return say('골드 부족');if(p.bag.length>=12)return say('가방이 가득 찼어요');p.gold-=a[3];add(b.dataset.buy);beep(600,.08);say('구매 완료')})}
function bagUI(){show('<h2>가방 '+p.bag.length+'/12</h2><div class="row">'+Array.from({length:12},(_,i)=>{let a=items[p.bag[i]];return '<div class="slot">'+(a?a[0]:'빈 칸')+(a?'<br>'+a[1]+' +'+a[2]+'<br><button data-use="'+i+'">사용</button>':'')+'</div>'}).join('')+'</div><button id="x">닫기</button>');$('x').onclick=close;document.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{let i=+b.dataset.use,a=items[p.bag[i]],k=a[1],mx=k==='hp'?'mhp':'mmp';if(p[k]>=p[mx])return say('이미 가득 찼어요');p[k]=Math.min(p[mx],p[k]+a[2]);p.bag.splice(i,1);bagUI();hud()})}
function interact(){if(panel)return;let n=map.npc.find(a=>Math.abs(p.x-a[0])<65);if(n)return n[2]==='q'?questUI():shop();if(Math.abs(p.x-map.po[0]-30)<60)return travel(map.po[2]);let l=map.la.find(a=>Math.abs(p.x-a[0])<24&&p.y+p.h>a[1]&&p.y<a[1]+a[2]);if(l){p.climb=true;p.vy=0}}
function jump(){if(p.climb){p.climb=false;p.vy=-210}else if(p.ground){p.vy=-305;p.ground=false;beep(540,.1,'triangle')}}
function attack(skill){if(panel||p.climb)return;if(skill&&(p.cd>0||p.mp<18))return say('기술 대기 중 또는 MP 부족');p.atk=skill?.38:.22;if(skill){p.cd=5;p.mp-=18;beep(700,.17,'sawtooth')}else beep(300,.07,'square');for(let m of ms){if(!m.alive||Math.abs(m.x-p.x)>(skill?135:74)||Math.sign(m.x-p.x||1)!==p.face)continue;let d=skill?36+p.lv*8:18+p.lv*5;m.hp-=d;m.hit=.15;nums.push({x:m.x,y:m.y-10,t:'-'+d,life:.7,col:'#fff0ad'});if(m.hp<=0)kill(m)}if(skill)for(let i=0;i<12;i++)fx.push({x:p.x+p.face*(20+Math.random()*110),y:p.y+Math.random()*40,v:p.face*100,life:.35})}
function kill(m){let d=mons[m.t];m.alive=false;m.resp=9;gain(d.xp);p.gold+=d.g;nums.push({x:m.x,y:m.y-25,t:'+'+d.xp+' EXP +'+d.g+'G',life:1,col:'#ffe78e'});if(Math.random()<.78)add(d.drop);if(quest.on&&!quest.done&&++quest.k>=5){quest.done=true;say('의뢰 달성! 모아에게 돌아가세요')}beep(180,.12,'triangle')}
function hurt(){if(p.inv>0)return;p.inv=1;p.hp-=10;nums.push({x:p.x,y:p.y-10,t:'-10',life:.7,col:'#ff7777'});beep(110,.12,'sawtooth');if(p.hp<=0){p.hp=p.mhp;p.mp=p.mmp;p.gold=Math.max(0,p.gold-10);p.x=110;p.y=425;say('회복했어요 · 10G 손실')}hud()}
function update(dt){if(panel)return;p.t+=dt;p.cd=Math.max(0,p.cd-dt);p.atk=Math.max(0,p.atk-dt);p.inv=Math.max(0,p.inv-dt);p.mp=Math.min(p.mmp,p.mp+dt);let L=keys.ArrowLeft||keys.a,R=keys.ArrowRight||keys.d,U=keys.ArrowUp||keys.w,D=keys.ArrowDown||keys.s,l=map.la.find(a=>Math.abs(a[0]-p.x)<20&&p.y+p.h>a[1]-5&&p.y<a[1]+a[2]+5);if(p.climb&&l){p.x=l[0];if(U)p.y-=125*dt;if(D)p.y+=125*dt;p.y=Math.max(l[1]-p.h,Math.min(l[1]+l[2]-p.h,p.y));if(p.y<=l[1]-p.h)p.climb=false}else{p.climb=false;p.vx=(R-L)*180;if(p.vx)p.face=Math.sign(p.vx);p.x+=p.vx*dt;let old=p.y;p.vy+=640*dt;p.y+=p.vy*dt;p.ground=false;if(p.vy>=0)for(let a of map.pl)if(p.x+p.w>a[0]&&p.x<a[0]+a[2]&&old+p.h<=a[1]&&p.y+p.h>=a[1]){p.y=a[1]-p.h;p.vy=0;p.ground=true}if(U&&l){p.climb=true;p.vy=0}}p.x=Math.max(0,Math.min(map.w-p.w,p.x));if(p.y>620){p.y=420;p.hp=Math.max(1,p.hp-20)}
+for(let m of ms){if(!m.alive){m.resp-=dt;if(m.resp<=0){m.alive=true;m.hp=m.max;m.x=m.home;m.y=468-mons[m.t].h}continue}let d=mons[m.t];if(d.ai===0){m.x+=m.dir*d.s*dt;if(Math.abs(m.x-m.home)>90)m.dir*=-1}else if(d.ai===1){if(Math.abs(p.x-m.x)<260){m.dir=Math.sign(p.x-m.x)||m.dir;m.x+=m.dir*d.s*dt}}else{if(Math.random()<dt*.6&&m.y>=430)m.vy=-220;m.vy+=500*dt;m.y+=m.vy*dt;if(m.y>468-d.h){m.y=468-d.h;m.vy=0}m.x+=m.dir*d.s*.4*dt}if(Math.abs(p.x-m.x)<(p.w+d.w)*.45&&Math.abs(p.y-m.y)<35)hurt()}
+for(let a of fx){a.x+=a.v*dt;a.life-=dt}fx=fx.filter(a=>a.life>0);for(let a of nums){a.y-=25*dt;a.life-=dt}nums=nums.filter(a=>a.life>0);cam=Math.max(0,Math.min(map.w-960,p.x-390));hud()}
+function round(x,y,w,h,r,color){g.fillStyle=color;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
+function draw(){let gr=g.createLinearGradient(0,0,0,540);gr.addColorStop(0,map.sky);gr.addColorStop(1,mapid==='town'?'#edc79b':'#18283b');g.fillStyle=gr;g.fillRect(0,0,960,540);for(let i=0;i<7;i++){let x=i*170-cam*.2%170;g.fillStyle=mapid==='town'?'#68949a':'#29444a';g.beginPath();g.moveTo(x,430);g.lineTo(x+80,180+i%3*20);g.lineTo(x+160,430);g.fill();if(mapid==='town'){g.fillStyle='#805d48';g.fillRect(x+50,340,80,105);g.fillStyle='#d9956e';g.beginPath();g.moveTo(x+35,342);g.lineTo(x+90,295);g.lineTo(x+145,342);g.fill()}}
+g.save();g.translate(-cam,0);for(let a of map.platforms){g.fillStyle=mapid==='town'?'#66584e':'#3a5147';g.fillRect(a[0],a[1],a[2],90);g.fillStyle='#59805b';g.fillRect(a[0],a[1],a[2],7)}for(let a of map.ladders){g.fillStyle='#bd925c';g.fillRect(a[0]-10,a[1],4,a[2]);g.fillRect(a[0]+7,a[1],4,a[2]);for(let y=a[1]+8;y<a[1]+a[2];y+=18)g.fillRect(a[0]-10,y,21,4)}let po=map.po;g.strokeStyle='#9af7ff';g.lineWidth=5;g.beginPath();g.ellipse(po[0]+30,po[1]+25,30,25,0,0,7);g.stroke();g.fillStyle='white';g.textAlign='center';g.fillText('포탈 ↑',po[0]+30,po[1]-8);
+for(let n of map.npc){let x=n[0];round(x-10,386,20,24,6,n[2]==='q'?'#dfbb70':'#83c3d0');round(x-10,410,20,20,5,'#748b73');g.fillStyle='white';g.fillText(n[1],x,376);g.fillText('↑ 대화',x,365)}
+for(let m of ms){if(!m.alive)continue;let d=mons[m.t],x=m.x,y=m.y;round(x,y,d.w,d.h,11,d.c);g.fillStyle='#253848';g.fillRect(x+7,y+10,4,4);g.fillRect(x+d.w-11,y+10,4,4);g.fillStyle='#222';g.fillRect(x,y-7,d.w,3);g.fillStyle='#ef6472';g.fillRect(x,y-7,d.w*m.hp/m.max,3);g.fillStyle='white';g.fillText(d.n,x+d.w/2,y-10)}
+let x=p.x,y=p.y;g.save();g.translate(x+14,y);g.scale(p.face,1);if(p.atk){g.strokeStyle='#fff0ad';g.lineWidth=6;g.beginPath();g.arc(20,22,34,-1,.8);g.stroke()}round(-9,20,18,22,4,'#477a9b');round(-8,3,16,18,6,'#efc6a0');round(-10,0,20,7,4,'#665068');g.fillStyle='#292335';g.fillRect(2,10,3,3);g.strokeStyle='#eee';g.lineWidth=3;g.beginPath();g.moveTo(9,25);g.lineTo(p.atk?30:17,p.atk?13:34);g.stroke();g.restore();g.restore();
+for(let a of fx){g.fillStyle='#9af7ff';g.fillRect(a.x-cam,a.y,5,5)}for(let a of nums){g.fillStyle=a.col;g.textAlign='center';g.font='bold 14px sans-serif';g.fillText(a.t,a.x-cam,a.y)}g.fillStyle='#152032dd';g.fillRect(785,17,155,48);g.strokeStyle='#aaa';g.strokeRect(792,24,140,32);g.fillStyle='#ffe57b';g.fillRect(795+p.x/map.w*130,38,5,5)}
+function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}function kd(e){let k=e.key;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Alt','Control','Shift',' '].includes(k))e.preventDefault();if(keys[k])return;keys[k]=true;if(k==='Alt'||k===' ')jump();if(k==='Control')attack(false);if(k==='Shift')attack(true);if(k==='ArrowUp'||k==='w')interact();if(k==='i'||k==='I')panel?close():bagUI();if(k==='Escape')close()}window.addEventListener('keydown',kd);window.addEventListener('keyup',e=>keys[e.key]=false);spawn();hud();requestAnimationFrame(loop);
</script></div>
